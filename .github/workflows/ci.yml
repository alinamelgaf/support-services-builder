name: Validate source and builds
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: node scripts/check-public.mjs
      - run: pnpm check:release
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-public.mjs --built
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test PWA installation and upgrade over HTTPS
        env:
          SSB_NATIVE_INSTALL: '1'
        run: |
          export SSB_TEST_TLS_DIR="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext subjectAltName=IP:127.0.0.1 -keyout "$SSB_TEST_TLS_DIR/key.pem" -out "$SSB_TEST_TLS_DIR/cert.pem"
          pnpm test:browser
      - run: pnpm package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-builds
          path: release/
          if-no-files-found: error
