name: Publish an approved release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag of the reviewed draft Release (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: approved-public-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && vars.SSB_PUBLIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Validate requested tag
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Verify release version
        id: verify
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          MAIN_COMMIT: ${{ github.sha }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD "$MAIN_COMMIT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm check:release
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-public.mjs --built
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test PWA installation and upgrade over HTTPS
        env:
          SSB_NATIVE_INSTALL: '1'
        run: |
          export SSB_TEST_TLS_DIR="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext subjectAltName=IP:127.0.0.1 -keyout "$SSB_TEST_TLS_DIR/key.pem" -out "$SSB_TEST_TLS_DIR/cert.pem"
          pnpm test:browser
      - run: pnpm package
      - run: node scripts/release-notes.mjs release/RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-release-zips
          path: release/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-release-zips
          path: release/
      - name: Attach checked files and publish reviewed draft
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          test "$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease --jq '.tagName + ":" + (.isDraft|tostring) + ":" + (.isPrerelease|tostring)')" = "$RELEASE_TAG:true:false"
          test -s RELEASE_NOTES.md
          sha256sum -c SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft=false
  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
